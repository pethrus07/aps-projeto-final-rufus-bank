# Ambiente de desenvolvimento local do Rufus Bank (Bloco 1: custo zero de dev).
# Sobe: PostgreSQL 17, API (porta 3000) e worker do outbox.
#
#   cp .env.example .env
#   docker compose up --build
#
# Na PRIMEIRA subida o PostgreSQL executa, em ordem alfabética, todos os
# arquivos de ../bloco-5-banco/sql/ (schema e dados de exemplo).
# Para aplicar de novo do zero: docker compose down -v && docker compose up --build

name: rufus

services:
  banco:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rufus}
      POSTGRES_USER: ${POSTGRES_USER:-rufus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rufus_local}
    ports:
      - "5432:5432"
    volumes:
      - dados_banco:/var/lib/postgresql/data
      - ../bloco-5-banco/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
      dockerfile: ../docker/api.Dockerfile
    env_file: .env
    environment:
      NODE_ENV: desenvolvimento
      OPENAPI_CAMINHO: /contrato/openapi.yaml
    ports:
      - "3000:3000"
    volumes:
      - ../bloco-8-dev/openapi.yaml:/contrato/openapi.yaml:ro
    depends_on:
      banco:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: ../docker/worker.Dockerfile
    env_file: .env
    environment:
      NODE_ENV: desenvolvimento
    depends_on:
      banco:
        condition: service_healthy

volumes:
  dados_banco:
